{%- raw -%}
- name: "Ensure local site is turned off"
  shell: "{{ compose_command_local }} down"
  delegate_to: localhost
  vars:
    ansible_become: no


- name: "Delete files in the local postgres data directory"
  shell: >
    {{ compose_command_local }} run --rm postgres bash -c "rm -r /var/lib/postgresql/data/*"
  delegate_to: localhost
  vars:
    ansible_become: no


- name: "Generate an unique filename for dump"
  set_fact:
    dump_filename: "/tmp/mirror-{{ project | mandatory }}-{{ ansible_date_time.epoch }}.pg_dump"


- name: "Create a fresh DB dump on the server (shared postgres)"
  shell: >
    docker exec -i postgres-{{ postgres_version | mandatory }}
    pg_dump -U {{ django_database_user }}
    --format=custom --compress=0 {{ django_database_name }} > {{ dump_filename }}
  no_log: "{{ ansible_verbosity < 3 }}"
  when: postgres_backend == 'shared'


- name: "Create a fresh DB dump on the server (local postgres)"
  shell: >
    {{ compose_command }} -f {{ compose_file }} exec -T postgres
    pg_dump -U {{ django_database_user }}
    --format=custom --compress=0 {{ django_database_name }} > {{ dump_filename }}
  args:
    chdir: "{{ code_dir }}"
  no_log: "{{ ansible_verbosity < 3 }}"
  when: postgres_backend == 'local'


# There is no postgres container on the host for a managed database, so the client tooling is run
#  in a throwaway container instead.
- name: "Create a fresh DB dump on the server (remote postgres)"
  shell: >
    docker run --rm --env PGPASSWORD={{ django_database_password | mandatory | quote }}
    postgres:{{ postgres_version | mandatory }}
    pg_dump --username={{ django_database_user | quote }}
    --host={{ django_database_host | mandatory | quote }}
    --port={{ django_database_port }}
    --dbname={{ django_database_name | quote }}
    --format=custom --compress=0 > {{ dump_filename }}
  no_log: "{{ ansible_verbosity < 3 }}"
  when: postgres_backend == 'remote'


- name: "Download the dump file"
  synchronize:
    src: "{{ dump_filename }}"
    dest: "{{ dump_filename }}"
    mode: pull
    set_remote_user: no
    recursive: no
  delegate_to: localhost
  vars:
    ansible_become: no


- name: "Turn postgres on again"
  shell: "{{ compose_command_local }} up -d --build postgres"
  delegate_to: localhost
  vars:
    ansible_become: no


- name: "Copy wait for it script into postgres container"
  shell: >
    {{ compose_command_local }} cp ../wait-for-it.sh postgres:/wait-for-it.sh
  delegate_to: localhost
  vars:
    ansible_become: no


- name: "Give postgres some time to start up"
  shell: >
    {{ compose_command_local }} exec -T postgres /wait-for-it.sh 127.0.0.1:5432 -t 60
  delegate_to: localhost
  vars:
    ansible_become: no


- name: "Delete the remote dump file"
  file:
    path: "{{ dump_filename }}"
    state: absent


- name: "Load the dump file locally"
  shell: >
     {{ compose_command_local }} exec -T postgres pg_restore -h 127.0.0.1 -U {{ project }} -d {{ project }} < {{ dump_filename }}
  delegate_to: localhost
  vars:
    ansible_become: no


- name: "Delete the local dump file"
  file:
    path: "{{ dump_filename }}"
    state: absent
  delegate_to: localhost
  vars:
    ansible_become: no


- name: "Turn everything off again"
  shell: "{{ compose_command_local }} down"
  delegate_to: localhost
  vars:
    ansible_become: no
{%- endraw %}
