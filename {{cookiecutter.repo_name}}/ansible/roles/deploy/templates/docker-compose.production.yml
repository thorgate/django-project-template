# Docker compose configuration for production
#
# This file is managed by ansible and is rendered onto the server as
#  {{ "{{ code_dir }}/{{ compose_file }}" }} - it is NOT the `docker-compose.production.yml` in the
#  repository root. That one is only used by CI to verify the production images still build.
#
# Paths, names and the database backend come from ansible variables (see group_vars/all/vars.yml),
#  so a host can override them without the repository having to change.

x-common-spec: &common-spec
  env_file: .env
  restart: unless-stopped

x-django-container-spec: &django-container-spec
  <<: *common-spec
# - {%  if cookiecutter.build_in_ci == YES %}
  image: "${SITE_DJANGO_IMAGE}:${SITE_VERSION}"
# - {%  else %}
  build:
    context: .
    dockerfile: Dockerfile-django.production
# - {%  endif %}
  volumes:
    - "{{ "{{ nginx_files_dir }}" }}/assets:/files/assets"
    - &django-media-volume "{{ "{{ nginx_files_dir }}" }}/media:/files/media"
    - &logs-volume "{{ "{{ log_dir }}" }}:/var/log/{{ "{{ project }}" }}"
  networks:
    - default
    - nginx-network
{{ "{% if postgres_backend == 'shared' %}" }}
    # Only the shared host container needs a network of its own - a `local` postgres is a service
    #  in this same compose project and a `remote` one is reached over `default`.
    - postgres-network
{{ "{% endif %}" }}
  depends_on:
    - redis
{{ "{% if postgres_backend == 'local' %}" }}
    - postgres
{{ "{% endif %}{% if postgres_backend == 'shared' %}" }}
  external_links:
    - postgres-${POSTGRES_VERSION:-{{ "{{ postgres_version }}" }}}:postgres
{{ "{% endif %}" }}

services:
  django:
    <<: *django-container-spec
    container_name: {{ "{{ project }}" }}_django
    # For some reason the command also has to be specified here, otherwise the entrypoint+command combination won't
    #  work.
    entrypoint: /usr/bin/wait-for-it.sh {{ "{{ django_database_host }}:{{ django_database_port }}" }} -t 60 --
    command: gunicorn {{ "{{ django_app }}" }}.wsgi:application --workers {{ "{{ gunicorn_worker_count }}" }} --bind :80
# - {%  if cookiecutter.frontend_style == SPA or cookiecutter.frontend_style == SPA_NEXT %}

  node:
    <<: *common-spec
# -   {%  if cookiecutter.build_in_ci == YES %}
    image: "${SITE_NODE_IMAGE}:${SITE_VERSION}"
# -   {%  else %}
    build:
      context: .
      dockerfile: Dockerfile-node.production
# -   {%  endif %}
    container_name: {{ "{{ project }}" }}_node
    command: pnpm start -p 80
    volumes:
      - "{{ "{{ nginx_files_dir }}" }}/app/assets:/files/assets"
      - *logs-volume
    networks:
      - default
      - nginx-network
# - {%  endif %}

# - {%  if cookiecutter.include_celery == YES %}
  celery:
    <<: *django-container-spec
    volumes:
      - *django-media-volume
      - *logs-volume
    networks:
      - default
{{ "{% if postgres_backend == 'shared' %}" }}
      - postgres-network
{{ "{% endif %}" }}
    entrypoint: /usr/bin/wait-for-it.sh {{ "{{ django_database_host }}:{{ django_database_port }}" }} -t 60 --
    command: celery --app {{ "{{ django_app }}" }} worker --autoscale 6,2 --loglevel INFO

  celery_beat:
    <<: *django-container-spec
    container_name: {{ "{{ project }}" }}_celery_beat
    volumes:
      - "{{ "{{ data_dir }}" }}/celery:/celery"
      - *logs-volume
    networks:
      - default
    depends_on:
      - redis
    # Disable pidfile by specifying an empty one. We used fixed container_name which provides single-running-process
    #  guarantee and the lack of pidfile ensures that Celery Beat starts even if the Docker container was killed and
    #  then restarted (in which case the pidfile would still be present).
    command: celery --app {{ "{{ django_app }}" }} beat --loglevel INFO --logfile /var/log/{{ "{{ project }}" }}/celery-beat.log --pidfile= --schedule /celery/celerybeat-schedule
# - {%  endif %}

{{ "{% if postgres_backend == 'local' %}" }}
  # Django of the version chosen for this project doesn't support the postgres version we have on
  # the server, so we run a separate container for it. The backups system should pick it up
  # automatically, as it supports custom postgres containers. Once the server is upgraded this
  # database can be migrated and the container removed (set postgres_backend to `shared`).
  postgres:
    <<: *common-spec
    image: postgres:${POSTGRES_VERSION:-{{ "{{ postgres_version }}" }}}-bullseye
    volumes:
      - "{{ "{{ data_dir }}" }}/postgres:/var/lib/postgresql/data"
    environment:
      # credentials taken from .env file
      # POSTGRES_DB is needed as well: without it initdb names the database after POSTGRES_USER,
      #  which would silently ignore a django_database_name that differs from django_database_user.
      POSTGRES_DB: "${DJANGO_DATABASE_NAME:-{{ "{{ django_database_name }}" }}}"
      POSTGRES_USER: "${DJANGO_DATABASE_USER:-{{ "{{ django_database_user }}" }}}"
      POSTGRES_PASSWORD: "${DJANGO_DATABASE_PASSWORD:-{{ "{{ project }}" }}}"
    networks:
      - default
{{ "{% endif %}" }}

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    sysctls:
      # To allow maintaining TCP backlog setting that defaults to 511
      net.core.somaxconn: 512
    volumes:
      - "{{ "{{ data_dir }}" }}/redis:/data"
    networks:
      - default

# These networks are created by the ansible deploy role (roles/deploy/tasks/main.yml), which also
#  attaches the global nginx container (and the shared postgres container, when one is used).
networks:
  default:
    external:
      name: {{ "{{ project }}" }}_default
  nginx-network:
    external:
      name: {{ "{{ project }}" }}_nginx
{{ "{% if postgres_backend == 'shared' %}" }}
  postgres-network:
    external:
      name: {{ "{{ project }}" }}_postgres
{{ "{% endif %}" }}
