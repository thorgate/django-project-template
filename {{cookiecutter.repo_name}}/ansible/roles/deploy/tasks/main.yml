- name: "Create needed directories"
  file:
      path: "{{ "{{ item }}" }}"
      state: directory
  loop:
      - "{{ "{{ log_dir }}" }}"


- name: "Checkout the code"
  git:
    repo: "{{ "{{ repository }}" }}"
    dest: "{{ "{{ code_dir }}" }}{% if cookiecutter.build_in_ci == YES %}/repository{% endif %}"
    version: "{{ "{% if force_deploy is defined %}{{ force_deploy }}{% else %}{{ deployment_version }}{% endif %}" }}"
    update: yes
    # force=yes will discard any changes in working directory
    # force: yes


# - {% if cookiecutter.build_in_ci == YES %}
- name: "Get the commit id"
  command: "git rev-parse HEAD"
  args:
      chdir: "{{ "{{ code_dir }}" }}/repository"
  register: git_commit_sha
# - {% endif %}


- name: "Check if database has been created previously"
  stat:
      path: "{{ "{{ code_dir }}" }}/database.lock"
  register: db_created

# Only the shared container is bootstrapped here: `local` is created by the postgres image from
#  the .env credentials, `remote` has to exist already - see docs/the_first_deploy.adoc.
- name: "Create database"
  shell: >
      echo "
        CREATE DATABASE {{ "{{ django_database_name }}" }};
        CREATE USER {{ "{{ django_database_user }}" }} WITH password '{{ "{{ django_database_password | mandatory }}" }}';
        GRANT ALL PRIVILEGES ON DATABASE {{ "{{ django_database_name }}" }} to {{ "{{ django_database_user }}" }};
      " | docker exec -i postgres-{{ "{{ postgres_version | mandatory }}" }} psql -U postgres
  when:
    - postgres_backend == 'shared'
    - not db_created.stat.exists

- name: "Create database extensions"
  shell: >
    echo "
      CREATE EXTENSION IF NOT EXISTS citext;
    " | docker exec -i postgres-{{ "{{ postgres_version | mandatory }}" }} psql -U postgres -d {{ "{{ django_database_name }}" }}
  when:
    - postgres_backend == 'shared'
    - not db_created.stat.exists

- name: "Grant schema access"
  shell: >
     echo "
        GRANT all ON SCHEMA public to {{ "{{ django_database_user }}" }};
     " | docker exec -i postgres-{{ "{{ postgres_version | mandatory }}" }} psql -U postgres -d {{ "{{ django_database_name }}" }}
  when:
    - postgres_backend == 'shared'
    - not db_created.stat.exists


- name: "Create db creation lockfile"
  file:
      path: "{{ "{{ code_dir }}" }}/database.lock"
      state: touch
  when:
    - postgres_backend == 'shared'
    - not db_created.stat.exists


- name: "Install/update .env file"
  template:
      src: environment
      dest: "{{ "{{ code_dir }}" }}/.env"
      mode: 0600
      backup: yes
  tags:
    - env


# - {%- if cookiecutter.build_in_ci == YES %}
- name: "Create a helper script for sourcing to interface with container registry"
  template:
    src: registry.sh
    dest: "{{ "{{ code_dir }}" }}/registry.sh"


- name: "Ensure server has access to the container registry"
  shell:
    cmd: echo "$REGISTRY_TOKEN" | /usr/bin/docker login -u {{ "{{ project }}" }} --password-stdin registry.gitlab.com
    chdir: "{{ "{{ code_dir }}" }}"
  environment:
    DOCKER_CONFIG: "{{ "{{ code_dir }}" }}/.docker-cfg"
    REGISTRY_TOKEN: "{{ "{{ registry_token }}" }}"
    PATH: ""


# - {%- endif %}
- name: "Create logrotate.conf file"
  template:
      src: "logrotate.conf"
      dest: "/etc/logrotate.d/{{ "{{ project }}" }}"


- name: "Ensure docker networks exist"
  docker_network:
      name: "{{ "{{ item }}" }}"
  # The postgres network is only for the shared container; `local` and `remote` use `default`.
  loop: >-
      {{ "{{ [project ~ '_default', project ~ '_nginx']
          + ([project ~ '_postgres'] if postgres_backend == 'shared' else []) }}" }}


- name: "Attach shared containers to project specific networks"
  shell:
      cmd: >-
        docker inspect {{ "{{ item.container }}" }}
        {{ "{% raw %}--format='{{range $k,$v := .NetworkSettings.Networks}}{{println $k}}{{end}}'{% endraw %}" }}
        | grep {{ "{{ item.name }}" }}
        || docker network connect {{ "{{ item.name }} {{ item.container }}" }}
  loop: >-
      {{ "{{ [{'name': project ~ '_nginx', 'container': 'nginx'}]
          + ([{'name': project ~ '_postgres', 'container': 'postgres-' ~ postgres_version}]
             if postgres_backend == 'shared' else []) }}" }}


- name: "Install/update the compose file"
  template:
    src: docker-compose.production.yml
    dest: "{{ "{{ code_dir }}/{{ compose_file }}" }}"
    mode: 0644
    backup: yes
  tags:
    - compose


- name: "Build the project"
  shell:
    cmd: >-
      {{ "{{ compose_command }}" }}
      -f {{ "{{ compose_file }}" }}
      up --build --detach --no-color --force-recreate --remove-orphans
    chdir: "{{ "{{ code_dir }}" }}"
# - {%- if cookiecutter.build_in_ci == YES %}
  environment:
    DOCKER_CONFIG: "{{ "{{ code_dir }}" }}/.docker-cfg"
# - {%- endif %}
  when: start_project | bool
  register: result


# Print the build output
- debug:
    var: result
  when: start_project | bool


# With `start_project: false` the images are still {% if cookiecutter.build_in_ci == YES %}pulled{% else %}built{% endif %}, so the commands below can run.
- name: "{% if cookiecutter.build_in_ci == YES %}Pull{% else %}Build{% endif %} the project images"
  shell:
    cmd: >-
      {{ "{{ compose_command }}" }}
      -f {{ "{{ compose_file }}" }}
      {% if cookiecutter.build_in_ci == YES %}pull{% else %}build --pull{% endif %}
    chdir: "{{ "{{ code_dir }}" }}"
# - {%- if cookiecutter.build_in_ci == YES %}
  environment:
    DOCKER_CONFIG: "{{ "{{ code_dir }}" }}/.docker-cfg"
# - {%- endif %}
  when: not start_project | bool
  register: image_result


# Print the image output
- debug:
    var: image_result
  when: not start_project | bool


- name: "Run migrations"
  import_tasks: ../../helpers/run-management-command.yml
  vars:
    command_params: "migrate --noinput"


- name: "Run collectstatic"
  import_tasks: ../../helpers/run-management-command.yml
  vars:
    command_params: "collectstatic --noinput --ignore styles-src"


- name: "Run system checks"
  import_tasks: ../../helpers/run-management-command.yml
  vars:
    command_params: "check --deploy"


# - {% if cookiecutter.thorgate == NO %}
- name: "Set up shared nginx files"
  import_tasks: nginx_shared.yml


# - {%- endif %}
- name: "Set up certificates"
  import_tasks: letsencrypt.yml


- name: "Update nginx config"
  import_tasks: nginx.yml
  tags:
    - nginx


# `compose run` above started the services it depends on - leave the project stopped.
- name: "Stop the project"
  command: >-
      {{ "{{ compose_command }}" }}
      -f {{ "{{ compose_file }}" }}
      stop
  args:
    chdir: "{{ "{{ code_dir }}" }}"
  when: not start_project | bool
