- name: 'Check mandatory variables are defined'
  assert:
    that:
      - project is defined
      - code_dir is defined
      - source_host is defined
      - postgres_version is defined
      - django_database_password is defined


- set_fact:
    local_media_path: "./clone-{{ "{{ project | mandatory }}" }}-files/"


- name: "Clone certificates"
  import_tasks: clone_certificate.yml
  tags:
    - certs
    - certificates


- name: "Download media files"
  import_tasks: clone_media_source.yml
  tags:
    - media
    - files


- name: "Upload media files"
  import_tasks: clone_media_target.yml
  tags:
    - media
    - files


- name: "Clone the DB"
  import_tasks: clone_db.yml
  tags:
    - db
    - database


- name: "Setup the proxy"
  import_tasks: setup_proxy.yml
  when: setup_proxy | default(false)
  delegate_to: "{{ "{{ source_host | mandatory }}" }}"
  tags:
    - proxy
