# Which media backend the TARGET uses, and the transfer itself - source straight to target,
#  never through the controller.

- name: "Extract settings from container"
  import_tasks: ../../helpers/run-management-command.yml
  vars:
    command_params: "settings --keys AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_STORAGE_BUCKET_NAME GS_BUCKET_NAME GS_PROJECT_ID GS_CREDENTIALS"


- name: "Store settings as json {{ "{{ result.stdout }}" }}"
  set_fact:
    settings: "{{ "{{ result.stdout | from_json }}" }}"


- set_fact:
    target_media_backend: "FS"


- set_fact:
    target_media_backend: "S3"
  when: "'AWS_ACCESS_KEY_ID' in settings and settings.AWS_ACCESS_KEY_ID != '<unset>'"
  ignore_errors: yes


- set_fact:
    target_media_backend: "GCS"
  when: "'GS_PROJECT_ID' in settings and settings.GS_PROJECT_ID != '<unset>'"
  ignore_errors: yes


- name: "Fail if media cloning is not supported for the target backend"
  fail:
    msg: >-
      Target media backend {{ "{{ target_media_backend }}" }} does not have logic for cloning. Supported targets
      are a filesystem (FS) or an S3 bucket.
  when: "target_media_backend == 'GCS'"


- name: "Copy the media files to the target filesystem"
  import_tasks: clone_media_FS_to_FS.yml
  when: "target_media_backend == 'FS'"


- name: "Copy the media files to the target S3 bucket"
  import_tasks: clone_media_FS_to_S3.yml
  when: "target_media_backend == 'S3'"
