- name: "Stop the project"
  command: >-
      {{ "{{ source_compose_command }}" }}
        -f {{ "{{ source_compose_file }}" }}
        stop
  args:
    chdir: "{{ "{{ code_dir }}" }}"

# - {%- raw %}
- name: Define source postgres version when not set
  set_fact:
    source_postgres_version: "{{ source_postgres_version | default(postgres_version, true) }}"

- name: "Detach shared containers to project specific networks"
  shell:
      cmd: >-
        docker network disconnect {{ item.name }} {{ item.container }} || echo "Container {{ item.container }} not connected to network {{ item.name }}"
  loop:
      - name: "{{ project }}_nginx"
        container: nginx
      - name: "{{ project }}_postgres"
        container: "postgres-{{ source_postgres_version }}"

# The proxy site config below includes conf.d/common.<project>.django.include and (through
#  app.proxy_pass.include) conf.d/app.<project>.proxy.include, both written by the deploy role. A
#  source that predates this ansible stack does not have them, and `nginx -t` then fails with
#  `open() ".../common.<project>.django.include" failed (2: No such file or directory)`.
#
# Lay the full set down first. The site config it writes is immediately replaced by the proxy one
#  below, but the includes it needs are then in place.
- name: "Ensure the deploy role's nginx includes exist on the source host"
  import_tasks: ../../helpers/update-nginx-config.yml


- name: "Update nginx config"
  template:
    src: "site-nginx.conf"
    dest: "/etc/nginx/sites-enabled/{{ project }}"
  vars:
    target_host: "{{ inventory_hostname }}"

- name: "Update nginx proxy configs"
  template:
    src: "{{ item.src }}"
    dest: "/etc/nginx/conf.d/{{ item.dest }}"
  loop:
    - { src: "app.proxy_pass.include", dest: "app.{{ project }}.proxy_django.include" }
    - { src: "app.proxy_pass.include", dest: "app.{{ project }}.proxy_node.include" }
  vars:
    target_host: "{{ inventory_hostname }}"

- name: "Reload nginx"
  import_tasks: ../../helpers/reload-nginx.yml
