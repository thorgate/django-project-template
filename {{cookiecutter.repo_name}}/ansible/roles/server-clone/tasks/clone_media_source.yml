# Which media backend the SOURCE uses and where its media lives. clone_media_target.yml transfers.

- name: "Extract settings from container"
  import_tasks: ../../helpers/run-management-command.yml
  vars:
    command_params: "settings --keys AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_STORAGE_BUCKET_NAME GS_BUCKET_NAME GS_PROJECT_ID GS_CREDENTIALS"
  delegate_to: "{{ "{{ source_host | mandatory }}" }}"


- name: "Store settings as json {{ "{{ result.stdout }}" }}"
  set_fact:
    source_settings: "{{ "{{ result.stdout | from_json }}" }}"
  delegate_to: "{{ "{{ source_host | mandatory }}" }}"


- set_fact:
    media_backend: "FS"


- set_fact:
    media_backend: "S3"
  when: "'AWS_ACCESS_KEY_ID' in source_settings and source_settings.AWS_ACCESS_KEY_ID != '<unset>'"
  ignore_errors: yes


- set_fact:
    media_backend: "GCS"
  when: "'GS_PROJECT_ID' in source_settings and source_settings.GS_PROJECT_ID != '<unset>'"
  ignore_errors: yes


- name: "Fail if media cloning is not supported for the source backend"
  fail:
    msg: >-
      Source media backend {{ "{{ media_backend }}" }} does not have logic for cloning. Only a filesystem
      (FS) source is supported.
  when: "media_backend != 'FS'"


- name: "Install yq on the source host"
  pip:
    name: "yq"
  delegate_to: "{{ "{{ source_host | mandatory }}" }}"


- name: "Figure out the media directory on the source host"
  shell: "{{ "{{ source_compose_command }}" }} -f {{ "{{ source_compose_file }}" }} config | yq -r '.services.django.volumes[]' | grep '/files/media' | cut -d: -f1"
  args:
    chdir: "{{ "{{ code_dir | mandatory }}" }}"
  register: "source_media_directory"
  delegate_to: "{{ "{{ source_host | mandatory }}" }}"
