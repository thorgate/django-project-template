# ArgoCD ApplicationSet picks this up from:
#   tg-platform-gitops/argocd/applications/clients-helm-appset-dev.yaml
# The appset matches any repo in the `thorgate` group with topic
# `argo-managed` that has helm_deploy/dev/values.yaml committed.
#
# Two-app SPA-NEXT/SPA shape when frontend_style is `spa` or `spa-next`:
#   * django (API backend) at office.<base-host>
#   * node   (frontend)     at <base-host> - user-facing
# WEBAPP mode: django alone, serving the prebuilt webapp from its
# static dir at /.

chart: phoenix
chartVersion: "0.3.0-dev"   # Pin to an exact version once the chart stabilises

# applicationName flows into chart-rendered resource names (Service,
# Deployment, Middleware, Certificate, etc.). Those must be DNS-1123
# compliant - underscores break apply. Use as_hostname so repo_name
# values like `circular_orbit` render as `circular-orbit` here.
applicationName: {{ cookiecutter.repo_name|as_hostname }}

imagePullPolicy: Always
imageSecrets:
  - gitlab-registry

applications:
  django:
    # Image configuration lives in images.yaml (auto-updated by
    # argocd-image-updater via extra/imageupdater.yaml).

    port: 8000
    serviceType: ClusterIP
    replicas: 1

    # TODO: adjust gunicorn args per your app's WSGI module + concurrency
    command:
      - "gunicorn"
      - "{{ cookiecutter.django_folder_name }}.wsgi:application"
      - "--workers"
      - "2"
      - "--bind"
      - "0.0.0.0:8000"
      - "--access-logfile"
      - "-"

    # TODO: add your project's pre-start commands (migrations, collectstatic, etc.)
    initCommands:
      - name: db-migrations
        command: ["python", "manage.py", "migrate", "--noinput"]
      - name: check-deploy
        command: ["python", "manage.py", "check", "--deploy"]

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

    # Probe Host header set explicitly because Django's ALLOWED_HOSTS
    # rejects the kubelet's pod-IP-based Host header (returns 400
    # DisallowedHost).
    readinessProbe:
      httpGet:
        path: /{{ cookiecutter.django_health_check_path }}
        port: 8000
        httpHeaders:
          - name: Host
{%- if cookiecutter.thorgate == YES %}
            {%- if cookiecutter.frontend_style == SPA or cookiecutter.frontend_style == SPA_NEXT %}
            value: {{ cookiecutter.spa_django_host_prefix }}.{{ cookiecutter.repo_name|as_hostname }}.client-cluster-1.thorgatedigital.tools
            {%- else %}
            value: {{ cookiecutter.repo_name|as_hostname }}.client-cluster-1.thorgatedigital.tools
            {%- endif %}
{%- else %}
            value: {{ cookiecutter.live_domain_name }}   # TODO: confirm this matches your dev ingress
{%- endif %}
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5

    livenessProbe:
      httpGet:
        path: /{{ cookiecutter.django_health_check_path }}
        port: 8000
        httpHeaders:
          - name: Host
{%- if cookiecutter.thorgate == YES %}
            {%- if cookiecutter.frontend_style == SPA or cookiecutter.frontend_style == SPA_NEXT %}
            value: {{ cookiecutter.spa_django_host_prefix }}.{{ cookiecutter.repo_name|as_hostname }}.client-cluster-1.thorgatedigital.tools
            {%- else %}
            value: {{ cookiecutter.repo_name|as_hostname }}.client-cluster-1.thorgatedigital.tools
            {%- endif %}
{%- else %}
            value: {{ cookiecutter.live_domain_name }}
{%- endif %}
      initialDelaySeconds: 30
      periodSeconds: 20
      timeoutSeconds: 5

    # Database credentials provided by movetokube postgres-operator
    # (the Secret is generated from extra/postgres.yaml's PostgresUser CR).
    environmentFromSecret:
      DJANGO_DATABASE_NAME:
        name: dbcred-{{ cookiecutter.repo_name|as_hostname }}-dev-user
        key: DATABASE_NAME
      DJANGO_DATABASE_USER:
        name: dbcred-{{ cookiecutter.repo_name|as_hostname }}-dev-user
        key: LOGIN
      DJANGO_DATABASE_PASSWORD:
        name: dbcred-{{ cookiecutter.repo_name|as_hostname }}-dev-user
        key: PASSWORD
      DJANGO_DATABASE_PORT:
        name: dbcred-{{ cookiecutter.repo_name|as_hostname }}-dev-user
        key: PORT

    # The dbcred Secret may not populate DATABASE_HOST for OWNER users
    # (it's cross-namespace anyway); pin to the in-cluster service.
    environment:
      DJANGO_DATABASE_HOST: pg17-rw.databases.svc.cluster.local
      DJANGO_DATABASE_SSLMODE: require
      # Dockerfile-django.production COPYs the django folder INTO /app,
      # so the settings module is reachable as `settings.cloud` (no
      # <project>. prefix). Matches kostra's pattern.
      DJANGO_SETTINGS_MODULE: settings.cloud
      # Phoenix chart's redis-ha subchart deploys at <release>-redis-ha:6379
      # but doesn't auto-wire the URL into the django container. settings/base.py
      # default points at `redis:6379` which won't resolve in-namespace;
      # override explicitly.
      DJANGO_REDIS_URL: redis://{{ cookiecutter.repo_name|as_hostname }}-redis-ha:6379/1

{%- if cookiecutter.thorgate == YES %}
{%- if cookiecutter.frontend_style == SPA or cookiecutter.frontend_style == SPA_NEXT %}
      # SPA mode: django at office.<host>; node at <host> (user-facing).
      # See ansible/roles/deploy/templates/environment for the canonical
      # list of env vars in this scaffold.
      APP_PUBLIC_SITE_URL: https://{{ cookiecutter.repo_name|as_hostname }}.client-cluster-1.thorgatedigital.tools
      APP_SITE_URL: https://{{ cookiecutter.repo_name|as_hostname }}.client-cluster-1.thorgatedigital.tools
      APP_BACKEND_SITE_URL: https://{{ cookiecutter.spa_django_host_prefix }}.{{ cookiecutter.repo_name|as_hostname }}.client-cluster-1.thorgatedigital.tools
      APP_PUBLIC_BACKEND_SITE_URL: https://{{ cookiecutter.spa_django_host_prefix }}.{{ cookiecutter.repo_name|as_hostname }}.client-cluster-1.thorgatedigital.tools
      NEXTAUTH_URL: https://{{ cookiecutter.repo_name|as_hostname }}.client-cluster-1.thorgatedigital.tools
      DJANGO_SITE_URL: https://{{ cookiecutter.spa_django_host_prefix }}.{{ cookiecutter.repo_name|as_hostname }}.client-cluster-1.thorgatedigital.tools
      DJANGO_ALLOWED_HOSTS: {{ cookiecutter.spa_django_host_prefix }}.{{ cookiecutter.repo_name|as_hostname }}.client-cluster-1.thorgatedigital.tools,{{ cookiecutter.repo_name|as_hostname }}.client-cluster-1.thorgatedigital.tools
      # Parent-domain cookie so auth cookies set by django are visible
      # to node (browser sees them as same-site via shared parent).
      DJANGO_CSRF_COOKIE_DOMAIN: .{{ cookiecutter.repo_name|as_hostname }}.client-cluster-1.thorgatedigital.tools
{%- else %}
      # WEBAPP mode: single host (django serves the built webapp).
      APP_PUBLIC_SITE_URL: https://{{ cookiecutter.repo_name|as_hostname }}.client-cluster-1.thorgatedigital.tools
      APP_SITE_URL: https://{{ cookiecutter.repo_name|as_hostname }}.client-cluster-1.thorgatedigital.tools
      DJANGO_SITE_URL: https://{{ cookiecutter.repo_name|as_hostname }}.client-cluster-1.thorgatedigital.tools
      DJANGO_ALLOWED_HOSTS: {{ cookiecutter.repo_name|as_hostname }}.client-cluster-1.thorgatedigital.tools
      DJANGO_CSRF_COOKIE_DOMAIN: {{ cookiecutter.repo_name|as_hostname }}.client-cluster-1.thorgatedigital.tools
{%- endif %}
{%- else %}
      # TODO: set these to your project's actual hostnames (non-Thorgate).
      APP_PUBLIC_SITE_URL: https://{{ cookiecutter.live_domain_name }}
      DJANGO_ALLOWED_HOSTS: {{ cookiecutter.live_domain_name }}
      DJANGO_CSRF_COOKIE_DOMAIN: {{ cookiecutter.live_domain_name }}
{%- endif %}

{%- if cookiecutter.django_media_engine == S3 %}
      # S3 / DO Spaces. Bucket need not exist for boot - only used when
      # uploading media. Placeholder for the experimental scaffold.
      DJANGO_AWS_S3_ENDPOINT_URL: https://fra1.digitaloceanspaces.com
      DJANGO_AWS_STORAGE_BUCKET_NAME: {{ cookiecutter.repo_name|as_hostname }}-media
{%- endif %}

      DJANGO_SENTRY_ENVIRONMENT: dev
{%- if cookiecutter.frontend_style == SPA or cookiecutter.frontend_style == SPA_NEXT %}
      APP_PUBLIC_SENTRY_ENVIRONMENT: dev
{%- endif %}

      DJANGO_DEFAULT_FROM_EMAIL: {{ cookiecutter.admin_email }}
      DJANGO_SERVER_EMAIL: {{ cookiecutter.admin_email }}

      # TODO: SECRETS - currently defaulted by Django ("dummy key"),
      # not safe outside an experimental test repo. Seal these for any
      # real deployment via extra/sealed-secret-django-env.yaml:
      #   DJANGO_SECRET_KEY
{%- if cookiecutter.frontend_style == SPA or cookiecutter.frontend_style == SPA_NEXT %}
      #   NEXTAUTH_SECRET, DJANGO_JWT_PRIVATE_KEY / PUBLIC_KEY
{%- endif %}
      #   DJANGO_SENTRY_DSN, DJANGO_EMAIL_HOST_PASSWORD
{%- if cookiecutter.django_media_engine == S3 %}
      #   DJANGO_AWS_ACCESS_KEY_ID / DJANGO_AWS_SECRET_ACCESS_KEY
{%- endif %}

{%- if cookiecutter.thorgate == YES %}
    {%- if cookiecutter.frontend_style == SPA or cookiecutter.frontend_style == SPA_NEXT %}
    urlHost: {{ cookiecutter.spa_django_host_prefix }}.{{ cookiecutter.repo_name|as_hostname }}.client-cluster-1.thorgatedigital.tools
    {%- else %}
    urlHost: {{ cookiecutter.repo_name|as_hostname }}.client-cluster-1.thorgatedigital.tools
    {%- endif %}
{%- else %}
    urlHost: {{ cookiecutter.live_domain_name }}
{%- endif %}
    urlPath: /
    tier: backend

{%- if cookiecutter.frontend_style == SPA or cookiecutter.frontend_style == SPA_NEXT %}

  # node: frontend service (Razzle for SPA mode, Next.js for SPA-NEXT).
  # Image is registry.../<repo>/node (separate build from django).
  # Listens on port 80 per docker-compose.production.yml's
  # `pnpm start -p 80`.
  node:
    port: 80
    serviceType: ClusterIP
    replicas: 1

    command:
      - "pnpm"
      - "start"
      - "-p"
      - "80"

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

    {%- if cookiecutter.frontend_style == SPA_NEXT %}
    # Next.js: lightweight bundled /api/health route (see
    # app/pages/api/health.ts) returns {ok: true} as soon as the
    # server is ready - avoids the SSR overhead of probing `/`.
    readinessProbe:
      httpGet:
        path: /api/health
        port: 80
        httpHeaders:
          - name: Host
{%- if cookiecutter.thorgate == YES %}
            value: {{ cookiecutter.repo_name|as_hostname }}.client-cluster-1.thorgatedigital.tools
{%- else %}
            value: {{ cookiecutter.live_domain_name }}
{%- endif %}
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5

    livenessProbe:
      httpGet:
        path: /api/health
        port: 80
        httpHeaders:
          - name: Host
{%- if cookiecutter.thorgate == YES %}
            value: {{ cookiecutter.repo_name|as_hostname }}.client-cluster-1.thorgatedigital.tools
{%- else %}
            value: {{ cookiecutter.live_domain_name }}
{%- endif %}
      initialDelaySeconds: 30
      periodSeconds: 20
      timeoutSeconds: 5
    {%- else %}
    # Razzle (SPA mode): no built-in JSON health endpoint, probing `/`
    # works once SSR is up. Consider adding a static /_health route
    # for cheaper probes (see app/server/static/_health).
    readinessProbe:
      httpGet:
        path: /
        port: 80
        httpHeaders:
          - name: Host
{%- if cookiecutter.thorgate == YES %}
            value: {{ cookiecutter.repo_name|as_hostname }}.client-cluster-1.thorgatedigital.tools
{%- else %}
            value: {{ cookiecutter.live_domain_name }}
{%- endif %}
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5

    livenessProbe:
      httpGet:
        path: /
        port: 80
        httpHeaders:
          - name: Host
{%- if cookiecutter.thorgate == YES %}
            value: {{ cookiecutter.repo_name|as_hostname }}.client-cluster-1.thorgatedigital.tools
{%- else %}
            value: {{ cookiecutter.live_domain_name }}
{%- endif %}
      initialDelaySeconds: 30
      periodSeconds: 20
      timeoutSeconds: 5
    {%- endif %}

    environment:
      # Public URLs (also baked at next build time via APP_PUBLIC_*);
      # these are runtime overrides for SSR + next-auth.
{%- if cookiecutter.thorgate == YES %}
      APP_PUBLIC_SITE_URL: https://{{ cookiecutter.repo_name|as_hostname }}.client-cluster-1.thorgatedigital.tools
      APP_SITE_URL: https://{{ cookiecutter.repo_name|as_hostname }}.client-cluster-1.thorgatedigital.tools
      APP_BACKEND_SITE_URL: https://{{ cookiecutter.spa_django_host_prefix }}.{{ cookiecutter.repo_name|as_hostname }}.client-cluster-1.thorgatedigital.tools
      APP_PUBLIC_BACKEND_SITE_URL: https://{{ cookiecutter.spa_django_host_prefix }}.{{ cookiecutter.repo_name|as_hostname }}.client-cluster-1.thorgatedigital.tools
      NEXTAUTH_URL: https://{{ cookiecutter.repo_name|as_hostname }}.client-cluster-1.thorgatedigital.tools
{%- else %}
      APP_PUBLIC_SITE_URL: https://{{ cookiecutter.live_domain_name }}
      APP_SITE_URL: https://{{ cookiecutter.live_domain_name }}
{%- endif %}

      APP_PUBLIC_SENTRY_ENVIRONMENT: dev

      # TODO: SECRETS - seal these via extra/sealed-secret-node-env.yaml:
      #   NEXTAUTH_SECRET (required for next-auth in non-dev mode)
      #   APP_PUBLIC_JWT_PUBLIC_KEY (mirror of django's)
      #   APP_PUBLIC_SENTRY_DSN

{%- if cookiecutter.thorgate == YES %}
    urlHost: {{ cookiecutter.repo_name|as_hostname }}.client-cluster-1.thorgatedigital.tools
{%- else %}
    urlHost: {{ cookiecutter.live_domain_name }}
{%- endif %}
    urlPath: /
    tier: frontend
{%- endif %}

# Ingress
ingress:
  enabled: true
  type: traefik
  tls:
    enabled: true
    certIssuer: letsencrypt-prod
    certIssuerKind: ClusterIssuer
  defaultResponseHeaders:
    X-Frame-Options: {{ cookiecutter.x_frame_options }}
    X-Content-Type-Options: nosniff
{%- if cookiecutter.thorgate == YES %}
    X-Robots-Tag: "noindex nofollow"   # TODO: drop this once the app is publicly indexable
{%- endif %}

# dpt-template settings/base.py defaults to Redis for CACHES (and celery
# broker if include_celery=yes), so the chart's redis-ha sub-chart is
# enabled by default. The Phoenix chart wires DJANGO_REDIS_URL to the
# in-namespace service automatically.
#
# Set to false ONLY if your app overrides CACHES in settings/cloud.py
# to LocMemCache (kostra's pattern - internal tool with low load).
redis-ha:
  enabled: true

# Sync waves: extras (configmap, postgres, secrets) apply at default wave
# (0/10), this chart's resources at wave 30 so migrations run after the
# Postgres CR has reconciled. The movetokube CR health customisation in
# argocd-cm gates the Postgres CR's "Healthy" status on
# .status.succeeded=true, so wave 30 waits for the actual DB + Secret.
hookAnnotations:
  argocd.argoproj.io/sync-wave: "30"

commonAnnotations:
  argocd.argoproj.io/sync-wave: "30"

# Image-updater config is in extra/imageupdater.yaml (CRD-based, not
# inline). Leave this disabled.
imageUpdater:
  enabled: false
