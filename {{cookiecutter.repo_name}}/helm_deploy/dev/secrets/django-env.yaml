# Plaintext Django secrets for the dev environment.
#
# THIS FILE IS GITIGNORED AND MUST STAY THAT WAY - it holds real secrets.
# Fill in the REPLACE_ME values, run ./seal.sh, and commit only the
# generated ../extra/sealed-secret-django-env.yaml.
#
# DJANGO_SECRET_KEY was generated for you at project generation time (same
# as ansible/host_vars/*/vault.yml), so you can seal this as-is if you do
# not need Sentry / SMTP{% if cookiecutter.frontend_style == SPA or cookiecutter.frontend_style == SPA_NEXT %} / JWT auth{% endif %} yet - delete the keys you do not use
# rather than sealing an empty string, since an empty env var overrides the
# Django setting default.
#
# Referenced from ../values.yaml as:
#   applications.django.environmentSecret: {{ cookiecutter.repo_name|as_hostname }}-django-env
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ cookiecutter.repo_name|as_hostname }}-django-env
  namespace: {{ cookiecutter.repo_name|as_hostname }}-dev
type: Opaque
stringData:
  DJANGO_SECRET_KEY: "{{ random_ascii_string(64) }}"
  DJANGO_HEALTH_CHECK_ACCESS_TOKEN: "{{ random_ascii_string(32) }}"

  # Error reporting - drop this key entirely if you are not using Sentry.
  DJANGO_SENTRY_DSN: "REPLACE_ME_or_delete_this_key"

  # SMTP - drop this key entirely if the project sends no mail yet.
  DJANGO_EMAIL_HOST_PASSWORD: "REPLACE_ME_or_delete_this_key"
{%- if cookiecutter.django_media_engine == S3 %}

  # Media storage (bucket name + endpoint are non-secret, see
  # ../extra/configmap.yaml).
  DJANGO_AWS_ACCESS_KEY_ID: "REPLACE_ME"
  DJANGO_AWS_SECRET_ACCESS_KEY: "REPLACE_ME"
{%- endif %}
{%- if cookiecutter.django_media_engine == GCS %}

  # Contents of the GCS credentials.json, as a single-line JSON string.
  DJANGO_GS_CREDENTIALS: 'REPLACE_ME'
{%- endif %}
{%- if cookiecutter.frontend_style == SPA or cookiecutter.frontend_style == SPA_NEXT %}

  # JWT signing keypair shared with the node app (which gets the PUBLIC half
  # as APP_PUBLIC_JWT_PUBLIC_KEY in node-env.yaml - the two must match).
  # Generate a pair:
  #   ssh-keygen -t rsa -b 4096 -m PEM -f jwt.key -N '' && \
  #     openssl rsa -in jwt.key -pubout -outform PEM -out jwt.key.pub
  # then paste the PEM blocks below (keep the 4-space indent) and
  # `rm jwt.key jwt.key.pub`.
  DJANGO_JWT_PRIVATE_KEY: |
    REPLACE_ME
  DJANGO_JWT_PUBLIC_KEY: |
    REPLACE_ME
{%- endif %}
