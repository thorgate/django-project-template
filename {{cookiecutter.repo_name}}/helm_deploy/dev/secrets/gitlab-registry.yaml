# Plaintext registry pull credentials for the dev environment.
#
# THIS FILE IS GITIGNORED AND MUST STAY THAT WAY - it holds a real token.
# Fill in the REPLACE_ME values, run ./seal.sh, and commit only the
# generated ../extra/sealed-secret-gitlab-registry.yaml.
#
# The name `gitlab-registry` is what ../values.yaml lists under
# `imageSecrets`; if you rename it here, rename it there too.
#
# Create the token in GitLab: Settings -> Repository -> Deploy tokens.
# Scope: `read_registry` only. Username and token go below verbatim.
#
# Prefer generating this file instead of hand-editing (it writes the same
# shape, base64-encoded):
#
#   kubectl create secret docker-registry gitlab-registry \
#     --namespace {{ cookiecutter.repo_name|as_hostname }}-dev \
#     --docker-server=registry.gitlab.com \
#     --docker-username='<deploy-token-username>' \
#     --docker-password='<deploy-token>' \
#     --dry-run=client -o yaml > secrets/gitlab-registry.yaml
#
# NOTE: this is the pull secret in the APP namespace. It is separate from
# `argocd/gitlab-registry-credentials` (which argocd-image-updater uses to
# poll for new tags) and from `argocd/gitlab-write-credentials` (which it
# uses to push the images.yaml bump). Those two live in the `argocd`
# namespace and are created once per cluster, out-of-band - see
# ../README.md "Operational notes".
---
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-registry
  namespace: {{ cookiecutter.repo_name|as_hostname }}-dev
type: kubernetes.io/dockerconfigjson
stringData:
  # Single-line JSON. `auth` is unnecessary when username/password are set.
  .dockerconfigjson: '{"auths":{"registry.gitlab.com":{"username":"REPLACE_ME_deploy_token_username","password":"REPLACE_ME_deploy_token"}}}'
