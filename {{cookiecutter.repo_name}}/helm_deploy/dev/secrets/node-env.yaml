# Plaintext node (frontend) secrets for the dev environment.
#
# THIS FILE IS GITIGNORED AND MUST STAY THAT WAY - it holds real secrets.
# Fill in the REPLACE_ME values, run ./seal.sh, and commit only the
# generated ../extra/sealed-secret-node-env.yaml.
#
# NEXTAUTH_SECRET was generated for you at project generation time (same as
# ansible/host_vars/*/vault.yml). Delete keys you do not use rather than
# sealing an empty string.
#
# Referenced from ../values.yaml as:
#   applications.node.environmentSecret: {{ cookiecutter.repo_name|as_hostname }}-node-env
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ cookiecutter.repo_name|as_hostname }}-node-env
  namespace: {{ cookiecutter.repo_name|as_hostname }}-dev
type: Opaque
stringData:
  NEXTAUTH_SECRET: "{{ random_ascii_string(64) }}"

  # Error reporting - drop this key entirely if you are not using Sentry.
  APP_PUBLIC_SENTRY_DSN: "REPLACE_ME_or_delete_this_key"

  # MUST be byte-identical to DJANGO_JWT_PUBLIC_KEY in django-env.yaml -
  # node verifies the tokens django signs. Paste the same PEM block.
  APP_PUBLIC_JWT_PUBLIC_KEY: |
    REPLACE_ME
